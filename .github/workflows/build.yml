name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pasang dependensi
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer "cython<3" virtualenv pillow
      - name: Buat ikon aplikasi
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw
          S = 512
          img = Image.new("RGBA", (S, S))
          px = img.load()
          for y in range(S):
              for x in range(S):
                  t = (x + y) / (2 * S)
                  px[x, y] = (int(79 + (124 - 79) * t), int(70 + (58 - 70) * t), int(229 + (237 - 229) * t), 255)
          mask = Image.new("L", (S, S), 0)
          ImageDraw.Draw(mask).rounded_rectangle((0, 0, S, S), radius=110, fill=255)
          img.putalpha(mask)
          d = ImageDraw.Draw(img)
          d.rounded_rectangle((90, 170, 422, 400), radius=36, fill=(255, 255, 255, 255))
          d.rounded_rectangle((90, 140, 360, 200), radius=24, fill=(255, 255, 255, 215))
          d.rounded_rectangle((300, 250, 422, 320), radius=30, fill=(79, 70, 229, 255))
          d.ellipse((330, 266, 362, 298), fill=(255, 255, 255, 255))
          img.save("icon.png")
          PY
      - name: Build APK
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: CatatanKeuangan-APK
          path: bin/*.apk
